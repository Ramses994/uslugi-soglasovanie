services:
  uslugi-soglasovanie:
    build: .
    container_name: uslugi-soglasovanie
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Порт хоста настраивается через APP_PORT в .env (docker compose сам
      # подставляет переменные из .env файла в проекте — не путать с
      # env_file: выше, который передаёт переменные ВНУТРЬ контейнера).
      # По умолчанию 8000: на реальном сервере 192.168.2.104 порт 80 уже
      # занят Zabbix (monitoring-zabbix-web-1) — это не гипотетический
      # случай "а вдруг", а то, что фактически произошло при первом деплое
      # (см. ТЗ.md, раздел 13.1). Если на вашем сервере 80 свободен и вы
      # хотите открывать форму без порта в адресе — добавьте APP_PORT=80 в
      # .env (не в этот файл, чтобы не потерять при обновлении из репозитория).
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Справочники (approvers.json/branches.json), sqlite-журнал заявок и
      # файлы ЕРЛУ-КДЛ/Минздрав живут вне образа — правки через вкладку
      # «Администрирование» и новые заявки должны переживать пересборку/
      # обновление контейнера.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
