<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body style="font-family:Segoe UI,Arial,sans-serif;background:#f2f4f7;display:flex;
             align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;">
  <div style="background:#fff;padding:32px 40px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:520px;width:100%;">
    <h2 style="color:{{ accent }};margin:0 0 8px 0;font-size:20px;">{{ title }}</h2>
    <p style="color:#333;font-size:14px;margin:0 0 16px 0;">
      Услуга «<b>{{ service_name }}</b>». Комментарий необязателен — его увидит инициатор в письме и в истории заявки.
    </p>
    <form method="post" action="{{ form_url }}" accept-charset="utf-8">
      <label for="comment" style="display:block;font-size:13px;color:#555;margin-bottom:6px;">{{ prompt }}</label>
      <textarea id="comment" name="comment" rows="5"
                style="width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;resize:vertical;"
                placeholder="{{ placeholder }}"></textarea>
      <button type="submit"
              style="display:inline-block;margin-top:16px;background:{{ accent }};color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;">
        {{ submit_label }}
      </button>
    </form>
  </div>
</body>
</html>
